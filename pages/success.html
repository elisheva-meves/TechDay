<!DOCTYPE html>
<!-- DOCTYPE: מודיע לדפדפן שזה מסמך HTML5, כדי שיציג אותו לפי התקן העדכני -->
<!-- html: התגית שעוטפת את כל הדף.
     lang="he": שפת הדף עברית (עוזר לקוראי מסך, למנועי חיפוש ולתרגום אוטומטי).
     dir="rtl": כיוון הכתיבה מימין לשמאל, כך שכל הדף "מתחיל" מצד ימין -->
<html lang="he" dir="rtl">
<!-- ===== head: מידע על הדף. שום דבר כאן לא מוצג בתוך הדף עצמו ===== -->
<head>
<meta charset="UTF-8">
<!-- meta charset: קידוד התווים. UTF-8 מאפשר להציג עברית, אימוג'י וסימנים מיוחדים בלי ג'יבריש.
     השורה הזו חייבת להיות בתחילת ה-head -->
<!-- viewport: חובה לאתר רספונסיבי. אומר לטלפון להציג את הדף ברוחב המסך האמיתי
     (width=device-width) ובלי הגדלה התחלתית (initial-scale=1.0), ולא "להקטין" אתר של מחשב.
     בלי השורה הזו ה-media queries ב-CSS לא יעבדו נכון בטלפון -->
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- meta description: תיאור קצר של הדף. לא מוצג בדף, אבל גוגל מציג אותו
     מתחת לכותרת בתוצאות החיפוש. לכל דף תיאור משלו (קידום אתרים, SEO) -->
<meta name="description" content="אישור קליטת הפרטים בטופס ההרשמה ל-TECHDAY.">
<!-- theme-color: צבע שורת הכתובת של הדפדפן בטלפון. זה אותו צבע כחול-לילה של רקע האתר -->
<meta name="theme-color" content="#080d1b">
<!-- title: הכותרת שמופיעה בלשונית של הדפדפן ובתוצאות החיפוש של גוגל.
     המבנה בכל הדפים זהה: שם הדף, קו אנכי ושם האתר -->
<title>הפרטים נקלטו בהצלחה | TECHDAY</title>
<!-- favicon: האייקון הקטן שמופיע בלשונית ליד הכותרת.
     הדף נמצא בתיקיית pages, ולכן ../ "עולה" תיקייה אחת למעלה, לתיקייה הראשית של האתר -->
<link rel="icon" href="../favicon.ico" type="image/x-icon">
<!-- preconnect: "מתחבר מראש" לשרתים של Google Fonts, עוד לפני שמבקשים מהם את הגופנים,
     וכך הגופנים נטענים מהר יותר.
     בשורה השנייה יש crossorigin, כי קובצי הגופן עצמם מורדים משרת אחר (fonts.gstatic.com) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- טעינת הגופנים מ-Google Fonts (שניהם תומכים בעברית):
     Heebo - הגופן של כל הטקסט באתר. wght@300;400;...;900: העוביים שמורידים, מדק מאוד ועד שמן מאוד
     Fira Code - גופן "מכונת כתיבה" (כל התווים באותו רוחב), לקוד ולשעות.
     &amp; בכתובת הוא הדרך לכתוב את התו & בתוך HTML (הוא מפריד בין שני הגופנים).
     display=swap: עד שהגופן נטען מוצג גופן גיבוי, כדי שהטקסט לא יהיה שקוף בזמן הטעינה -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800;900&amp;family=Fira+Code:wght@400;500;600&amp;display=swap">
<!-- קובץ העיצוב המשותף לכל הדפים: צבעים, גופנים, כותרת עליונה, תפריט, כפתורים, טבלאות וכותרת תחתונה -->
<link rel="stylesheet" href="../css/style.css">
<!-- קובץ העיצוב של דף האישור בלבד. הוא נטען אחרי style.css,
     ולכן כלל כאן יכול "לדרוס" כלל משותף עם אותו סלקטור -->
<link rel="stylesheet" href="../css/success.css">
</head>
<!-- ===== body: כל מה שמוצג בדף ===== -->
<body>
<!-- ===== header: הכותרת העליונה. זהה בכל דפי האתר =====
     ב-CSS (style.css) היא "דביקה" (position: sticky): נשארת בראש המסך בזמן גלילה.
     היא גם flex בשורה: הלוגו בצד אחד והתפריט בצד השני (justify-content: space-between).
     ב-CSS כתוב body > header - רק header שהוא ילד ישיר של body, ולא ה-header שבתוך main -->
<header>
  <!-- הלוגו ושם האתר עטופים בקישור אחד לדף הבית, כך שלחיצה על כל אחד מהם מחזירה לדף הבית -->
  <a href="../index.html">
    <!-- img: תמונת הלוגו (קובץ SVG - תמונה וקטורית שנשארת חדה בכל גודל).
         alt: טקסט חלופי, שקורא מסך מקריא לעיוורים ושמוצג אם התמונה לא נטענת.
         width ו-height: המידות של התמונה. הדפדפן שומר לה מקום מראש, והדף לא "קופץ" כשהיא נטענת -->
    <img src="../assets/images/logo.svg" alt="לוגו TECHDAY - לחיצה מובילה לדף הבית" width="40" height="40">
    <!-- strong: שם האתר, מודגש. החלק DAY עטוף ב-span, כדי שב-CSS יקבל צבע אחר (כחול) -->
    <strong>TECH<span>DAY</span></strong>
  </a>
  <!-- nav: תגית סמנטית לתפריט ניווט. בתוכה רשימה לא ממוספרת (ul), וכל פריט (li) הוא קישור לדף.
       aria-label: שם לתפריט בשביל קוראי מסך, כי יש באתר שני תפריטים (גם בכותרת התחתונה).
       ב-CSS הרשימה היא flex עם גלישה (flex-wrap), והקישורים נראים כמו כפתורים מעוגלים.
       הדפים האחרים נמצאים באותה תיקייה (pages), ולכן מספיק לכתוב את שם הקובץ.
       לדף הבית צריך לעלות תיקייה אחת: ../index.html -->
  <nav aria-label="תפריט ראשי">
    <ul>
      <li><a href="../index.html">דף הבית</a></li>
      <li><a href="development.html">פיתוח</a></li>
      <li><a href="infrastructure.html">תשתיות ואבטחה</a></li>
      <li><a href="data-ai.html">נתונים ו-AI</a></li>
      <li><a href="product-design.html">מוצר ועיצוב</a></li>
      <li><a href="about.html">אודות</a></li>
      <!-- aria-current="page": מסמן שזה הקישור לדף שבו נמצאים עכשיו.
           קורא מסך מודיע "הדף הנוכחי", וה-CSS מדגיש אותו בעזרת סלקטור תכונה: nav a[aria-current="page"] -->
      <li><a href="order.html" aria-current="page">הרשמה</a></li>
    </ul>
  </nav>
</header>

<!-- ===== div.wrapper: העוטף של התוכן המרכזי =====
     בדף הזה אין aside, ולכן main תופס את כל הרוחב.
     ב-CSS יש לו flex: 1, ולכן הוא תופס את כל הגובה הפנוי ודוחף את הכותרת התחתונה לתחתית המסך גם כשהדף קצר -->
<div class="wrapper">
<!-- ===== main: התוכן המרכזי והייחודי של הדף. יש רק main אחד בכל דף ===== -->
<main>
  <!-- ===== דף אישור: לכאן מגיעים אחרי שליחת הטופס (action="success.html") =====
       זה דף "דמוי שרת": באתר אמיתי שרת היה שומר את הפרטים ומחזיר דף כזה.
       הפרטים שנשלחו מופיעים בשורת הכתובת, אחרי סימן השאלה.
       ב-CSS (success.css) ה-section הוא כרטיס במרכז המסך -->
  <section>
    <!-- span.check: סמל ה-✓ הירוק. ה-span ריק, וה-CSS מצייר הכול:
         העיגול הירוק הוא ה-span עצמו (border-radius: 50%), והסימן ✓ הוא ::after
         עם שתי מסגרות (ימין ולמטה) שמסובבות ב-45 מעלות.
         יש לו שלוש אנימציות: pop (העיגול "קופץ" פנימה), draw (הסימן "מצויר") ו-pulse (הילה שמתרחבת בלולאה).
         aria-hidden="true": קישוט בלבד, קורא מסך מדלג עליו -->
    <span class="check" aria-hidden="true"></span>
    <h1>הפרטים נקלטו בהצלחה</h1>
    <p>תודה שהשארתם פרטים ל-TECHDAY.</p>

    <!-- רשימה של שני קישורים שמעוצבים ככפתורים. ב-CSS היא flex: הכפתורים זה לצד זה, במרכז.
         ../ בנתיבים: עולים מתיקיית pages לתיקייה הראשית -->
    <ul>
      <li><a class="btn primary" href="../index.html">חזרה לדף הבית</a></li>
      <li><a class="btn" href="../assets/files/techday-guide.pdf" download>הורדת המדריך (PDF)</a></li>
    </ul>
  </section>
</main>

</div>

<!-- ===== footer: הכותרת התחתונה. זהה בכל דפי האתר =====
     ב-CSS היא flex בשורה: זכויות היוצרים בצד אחד והקישורים בצד השני.
     &copy; היא "ישות" (entity) של HTML שמציגה את הסימן © -->
<footer>
  <p>כל הזכויות שמורות &copy; 2026 TECHDAY</p>
  <!-- תפריט ניווט שני, עם aria-label אחר, כדי שקורא מסך יבדיל בינו לבין התפריט הראשי -->
  <nav aria-label="קישורים תחתונים">
    <ul>
      <li><a href="about.html">אודות</a></li>
      <li><a href="order.html">הרשמה</a></li>
      <!-- download: הדפדפן מוריד את הקובץ למחשב, במקום לפתוח אותו בלשונית.
           את הסמל 📄 שליד הקישור לא כותבים כאן: ה-CSS מוסיף אותו לבד לכל קישור שמסתיים ב-.pdf (a[href$=".pdf"]::before) -->
      <li><a href="../assets/files/techday-guide.pdf" download>מדריך להורדה</a></li>
    </ul>
  </nav>
</footer>

<!-- כפתור "חזרה לראש הדף": קבוע בפינת המסך (position: fixed ב-CSS) ולא זז בגלילה.
     href="#": קישור לראש הדף. הגלילה חלקה בזכות scroll-behavior: smooth ב-CSS.
     aria-label: לכפתור יש רק חץ בלי מילים, ולכן נותנים לו שם בשביל קוראי מסך -->
<a class="to-top" href="#" aria-label="חזרה לראש הדף">↑</a>
</body>
</html>
